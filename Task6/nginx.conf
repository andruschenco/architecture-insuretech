http {
    # Зона для хранения состояния лимитов
    # - "limit_req_zone" создаёт зону размером 10 МБ для хранения состояний
    # - "$binary_remote_addr" — ключом является IP-адрес клиента
    # - "rate=10r/m" — ограничение: не более 10 запросов в минуту
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем ограничение
            # - "zone=mylimit" — используем созданную зону
            # - "burst=5" — разрешаем очередь до 5 запросов сверх лимита (для сглаживания пиков)
            # - "nodelay" — не задерживать запросы из очереди, сразу возвращать ответ или 429
            limit_req zone=mylimit burst=5 nodelay;

            # При превышении лимита возвращаем HTTP 429
            # Nginx по умолчанию возвращает 503, переопределяем на 429
            limit_req_status 429;

            proxy_pass http://backend_servers;
        }

        # Возвращаем понятное сообщение об ошибке
        error_page 429 @too_many_requests;
        location @too_many_requests {
            return 429 '{"error": "Too Many Requests", "message": "Limit exceeded: maximum 10 requests per minute"}\n';
            add_header Content-Type application/json;
        }
    }
}